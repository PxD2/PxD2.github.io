<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PXD2 Office</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="office.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#000000;--panel:#111113;--line:#2a2a2e;--text:#f2f2f4;--dim:#9a9ca3;--acc:#ff2b20;--red:#e10600;--ok:#6ee7a8;--warn:#f5c35b;--bad:#ff7a7a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:18px;letter-spacing:.12em;font-weight:800}
header .sub{font-size:10px;letter-spacing:.2em;color:var(--dim)}
#net{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
nav{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg);position:sticky;top:57px;z-index:4}
nav button{flex:0 0 auto}
main{max-width:980px;margin:0 auto;padding:16px}
button,.btn{background:#18181b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
button.on{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:800}
button:disabled{opacity:.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:12px;letter-spacing:.16em;color:var(--dim)}
.big{font-size:22px;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
input,textarea,select{width:100%;background:#0b0b0d;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px;letter-spacing:.06em}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 14px;text-align:center;color:var(--dim)}
.drop.hot{border-color:var(--acc);color:var(--acc)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.list li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .m{color:var(--dim);font-size:12px;white-space:nowrap}
.bar{height:6px;background:#222226;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.dim{color:var(--dim)}
pre{white-space:pre-wrap;word-break:break-word;background:#0b0b0d;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:340px;overflow:auto;font-size:13px}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1a0605;border:1px solid var(--red);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw}
#toast.show{opacity:1}
/* sticky-note texting */
.thread{min-height:240px;max-height:52vh;overflow:auto;background:#fff27a;color:#2b2600;border-radius:10px;padding:10px}
.msg{margin:0 0 10px;max-width:85%}.msg .w{font-size:11px;color:#8a7a20}.msg .b{white-space:pre-wrap;word-break:break-word}
.msg.me{margin-left:auto;text-align:right;color:#1d4d7a}
.compose{display:flex;gap:8px;margin-top:8px}.compose textarea{min-height:52px;flex:1;background:#fffbd0;color:#2b2600;border-color:#e8d84f}
body.mini{background:#fff27a}body.mini header,body.mini nav{display:none!important}body.mini main{padding:6px}
body.mini [data-pane]:not([data-pane=text]){display:none!important}body.mini [data-pane=text]{display:block!important}
body.mini a[target=pxd2text]{display:none}body.mini .card{background:#fff27a;border:0;padding:4px;margin:0}body.mini .card h3{color:#8a7a20}
body.mini .thread{max-height:calc(100vh - 150px);min-height:0;height:calc(100vh - 150px);padding:4px}
body.mini select{background:#fffbd0;color:#2b2600;border-color:#e8d84f;padding:4px;min-height:0}
/* pitch desktop */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;min-height:150px;text-align:center;font-size:14px;line-height:1.2}
.ptile img{width:72px;height:72px;object-fit:contain;border-radius:14px;background:#fff}
.pfb{width:72px;height:72px;border-radius:14px;background:var(--red);display:grid;place-items:center;font-size:34px;font-weight:800}
.pqrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pqr,.psoc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;background:#18181b;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pqr img{width:100%;max-width:120px;background:#fff;border-radius:6px;padding:4px}.psoc img{width:100%;height:90px;object-fit:cover;border-radius:6px}
.pbig{position:fixed;inset:0;z-index:50;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.pbig img{width:min(78vw,72vh);height:auto;image-rendering:pixelated}.pbn{font-size:22px;font-weight:800;text-align:center}.pbl{font-size:13px;color:#555;word-break:break-all;text-align:center}.pbx{font-size:12px;color:#999}
header{background:#000;border-bottom:2px solid var(--red)}nav{background:#000}
button.on{background:#1a0605}
/* PXD2 AI voice */
.ai-mic{width:min(220px,56vw);height:min(220px,56vw);border-radius:50%;border:0;background:var(--red);color:#fff;font-size:20px;font-weight:900;letter-spacing:.06em;display:grid;place-items:center;margin:26px auto 8px;box-shadow:0 0 0 10px #2a0403,0 18px 40px -10px rgba(225,6,0,.6)}
.ai-mic svg{width:64px;height:64px;display:block;margin:0 auto 6px}
.ai-mic.live{animation:aipulse 1.1s ease-in-out infinite}
@keyframes aipulse{0%,100%{box-shadow:0 0 0 10px #2a0403}50%{box-shadow:0 0 0 22px #4a0605}}
@media (prefers-reduced-motion:reduce){.ai-mic.live{animation:none;box-shadow:0 0 0 18px #4a0605}}
.ai-seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.ai-seg button{min-height:40px;padding:6px 14px}
.ai-seg button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
#aiText{background:#0b0b0d;color:var(--text);border-color:var(--line)}
.ai-heard{text-align:center;min-height:1.5em;font-size:18px;margin:8px 0}
.ai-log{max-height:46vh;overflow:auto}
.ai-log .q{color:var(--dim);margin:10px 0 2px}.ai-log .a{background:#18181b;border-left:3px solid var(--red);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.ai-log .s{color:var(--dim);font-size:13px;margin:4px 0}


header .sub{font-size:10px}
</style></head>
<body>
<header><img src="pxd2-logo.png" alt="PXD2 Studios" style="height:40px;width:auto;display:block"><div><h1>OFFICE</h1><div class="sub">WRITE · SHEETS · SLIDES · WORKS OFFLINE</div></div></header>
<main><div id="officeBody"></div></main>
<div id="toast"></div>
<script>window.PXD2_STANDALONE = true; function toast(t) { const e = document.getElementById("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 3200); }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });</script>
<script src="fflate.min.js?v=29"></script>
<script src="jspdf.umd.min.js?v=29"></script>
<script src="xlsx.full.min.js?v=29"></script>
<script src="pptxgen.bundle.js?v=29"></script>
<script src="office.js?v=29"></script>
</body></html>
