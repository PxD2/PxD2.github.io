<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio A floor</title>
  <style>
    :root { --bg:#0a0a0b; --fg:#e8e6e3; --muted:#9aa4ae; --honey:#e6b84d; --clay:#b85c38; --line:#2a2a2e; --ink:#1c1814; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
    header { display:flex; justify-content:space-between; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); }
    main { max-width:720px; margin:0 auto; padding:24px 18px 80px; display:grid; gap:14px; }
    .k { letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-size:11px; font-weight:700; }
    textarea, input { width:100%; background:#141416; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; }
    button { min-height:44px; cursor:pointer; border:0; border-radius:8px; font-weight:700; }
    .go { background:var(--clay); color:#f4efe6; width:100%; }
    .drop { min-height:88px; border:1px dashed var(--line); border-radius:10px; padding:14px; background:#141416; }
    video, img.still { width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; border-radius:8px; }
    .bad { color:#e07070; }
  </style>
</head>
<body>
  <header>
    <strong>Studio A</strong>
    <span class="k" id="gpu">looking for the 5080…</span>
  </header>
  <main>
    <p class="k">Git holds the pages. This box cuts.</p>
    <img class="still" id="still" alt="" />
    <video id="vid" controls playsinline hidden></video>
    <p class="k" id="clock">00:00 / 08:00</p>
    <div class="drop" id="scriptdrop">Script — drop or paste</div>
    <textarea id="script" rows="7" placeholder="Paste pages"></textarea>
    <div class="drop" id="stockdrop">Photo stocks — up to 3</div>
    <input id="stock" type="file" accept="image/*" multiple hidden />
    <input id="scriptfile" type="file" accept=".txt,.md,.fountain,text/plain" hidden />
    <button class="go" type="button" id="send">Send to the 5080</button>
    <p class="bad" id="err"></p>
  </main>
  <script>
    const gpu = document.getElementById("gpu");
    const err = document.getElementById("err");
    const script = document.getElementById("script");
    const stocks = [];
    fetch("/health").then(r => r.json()).then(g => {
      gpu.textContent = g.ok ? (g.name + " · " + g.vram_gb + " GB") : "5080 packs not loaded";
    }).catch(() => { gpu.textContent = "floor dark"; });
    document.getElementById("scriptdrop").onclick = () => document.getElementById("scriptfile").click();
    document.getElementById("scriptfile").onchange = async (e) => {
      const f = e.target.files[0]; if (f) script.value = await f.text();
    };
    document.getElementById("stockdrop").onclick = () => document.getElementById("stock").click();
    document.getElementById("stock").onchange = async (e) => {
      stocks.length = 0;
      for (const f of [...e.target.files].slice(0,3)) {
        stocks.push(await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); }));
      }
      document.getElementById("stockdrop").textContent = stocks.length + " stills on the floor";
    };
    document.getElementById("send").onclick = async () => {
      err.textContent = "";
      const r = await fetch("/job", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ script: script.value, stocks }) });
      const b = await r.json();
      if (!b.id) { err.textContent = b.error || "No take."; return; }
      const poll = setInterval(async () => {
        const j = await (await fetch("/job/"+b.id)).json();
        const last = (j.shots||[]).at(-1);
        if (last) {
          document.getElementById("still").src = last.still || "";
          if (last.video) { const v = document.getElementById("vid"); v.hidden = false; v.src = last.video; }
          const sec = (j.shots||[]).reduce((n,s)=>n+(s.sec||10),0);
          document.getElementById("clock").textContent = String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")+" / 08:00";
        }
        if (j.status === "in the can" || j.status === "stopped") {
          clearInterval(poll);
          if (j.error) err.textContent = j.error;
        }
      }, 3000);
    };
  </script>
</body>
</html>
