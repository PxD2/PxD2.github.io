<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PXD2 — list of sites</title>
  <meta name="description" content="Every PXD2 site: HOLD, school halls, Studio A, company, GitHub." />
  <link rel="canonical" href="https://pxd2.github.io/sites/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap" />
  <style>
    :root { --bg:#0a0a0b; --fg:#e8e6e3; --muted:#9aa4ae; --line:color-mix(in oklab,#e8e6e3 14%,transparent); --accent:#c8ccd4; }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif; }
    a { color:var(--accent); }
    .bar { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
    .bar a { color:var(--fg); text-decoration:none; }
    .wrap { max-width:46rem; margin:0 auto; padding:3.5rem 1.25rem 6rem; }
    .kicker { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }
    h1 { font-family:"Libre Baskerville",Georgia,serif; font-size:clamp(1.6rem,3vw,2.2rem); margin:.5rem 0 1rem; }
    h2 { font-family:"Libre Baskerville",Georgia,serif; font-size:1.05rem; margin:2.2rem 0 .8rem; }
    .lede { color:var(--muted); margin:0 0 1rem; }
    .net { display:grid; gap:10px; }
    .node { display:block; border:1px solid var(--line); padding:16px 18px; text-decoration:none; color:var(--fg); min-height:84px; }
    .node:hover { border-color:var(--accent); }
    .node .k { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
    .node h3 { font-family:"Libre Baskerville",Georgia,serif; font-size:1.1rem; margin:6px 0 4px; font-weight:700; }
    .node p { margin:0; color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="https://pxd2.github.io/">PXD2 · floor</a>
    <span>list of sites</span>
    <a href="https://github.com/PxD2">github.com/PxD2</a>
  </div>
  <main class="wrap">
    <p class="kicker">pxd2.github.io/sites</p>
    <h1>Every site we hold</h1>
    <p class="lede">One list. Every hall links here. HOLD: SFTP roots we host. Git publishes. Studio A is the floor. School is the rest.</p>
    <div id="groups"></div>
  </main>
  <script>
    fetch("sites.json").then(r => r.json()).then(d => {
      document.getElementById("groups").innerHTML = d.groups.map(g =>
        "<h2>" + g.title + "</h2><div class=\"net\">" +
        g.sites.map(s =>
          "<a class=\"node\" href=\"" + s.href + "\"><div class=\"k\">" + s.id + "</div><h3>" + s.name + "</h3><p>" + s.blurb + "</p></a>"
        ).join("") + "</div>"
      ).join("");
    });
  </script>
  <script src="/read-aloud.js" defer></script>
  <script src="/sites.js" defer></script>
</body>
</html>
