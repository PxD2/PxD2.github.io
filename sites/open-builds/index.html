<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PXD2 Open Builds — Comparee Hub index</title>
  <link rel="canonical" href="https://pxd2.github.io/sites/open-builds/" />
  <meta name="theme-color" content="#07080c" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" />
  <style>
    :root { --bg:#07080c; --ink:#e8e6df; --dim:#8b93a3; --gold:#f5c14a; --cyan:#00d4ea; --line:#1c2230; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 Barlow, system-ui, sans-serif; }
    header { padding:28px 20px 12px; max-width:1100px; margin:0 auto; }
    .kicker { letter-spacing:.22em; text-transform:uppercase; color:var(--gold); font:600 11px/1 Barlow, sans-serif; }
    h1 { font:700 34px/1 Oswald, sans-serif; margin:8px 0 6px; }
    p.lead { color:var(--dim); max-width:62ch; }
    a { color:var(--cyan); }
    .bar { display:flex; gap:10px; flex-wrap:wrap; max-width:1100px; margin:0 auto; padding:0 20px 16px; }
    input, select { background:#10131a; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:15px Barlow, sans-serif; }
    input { flex:1; min-width:220px; }
    .meta { max-width:1100px; margin:0 auto 8px; padding:0 20px; color:var(--dim); font-size:13px; }
    .grid { max-width:1100px; margin:0 auto; padding:0 20px 80px; display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
    article { border:1px solid var(--line); border-radius:12px; padding:14px; background:#0c0f16; }
    article h2 { font:600 16px/1.25 Barlow, sans-serif; margin:0 0 8px; }
    .links { font-size:13px; }
    nav.rooms { position:fixed; left:12px; bottom:12px; display:flex; gap:10px; flex-wrap:wrap; font:600 11px/1 Barlow,system-ui,sans-serif; letter-spacing:.22em; text-transform:uppercase; }
    nav.rooms a { color:#8b93a3; text-decoration:none; }
  </style>
</head>
<body>
  <header>
    <div class="kicker">PXD2 · Web Systems · held index</div>
    <h1>Open builds</h1>
    <p class="lead">Index of 348 public Comparee Hub listings and their GitHub repos. Reviews stay on <a href="https://comparee.ai/projects">comparee.ai/projects</a>.</p>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="Search title, slug, repo…" />
    <select id="gh"><option value="all">All</option><option value="github">Has GitHub</option><option value="none">No GitHub</option></select>
  </div>
  <div class="meta" id="meta">Loading catalog…</div>
  <div class="grid" id="grid"></div>
  <nav class="rooms"><a href="/">Floor</a><a href="/company/">Company</a><a href="/sites/">Sites</a><a href="/cad2/">Helix CAD</a><a href="/pxd2spaces/">Hackspace</a></nav>
  <script>
    const grid=document.getElementById('grid'), meta=document.getElementById('meta'), q=document.getElementById('q'), gh=document.getElementById('gh');
    let projects=[];
    function render(){
      const term=q.value.trim().toLowerCase(), mode=gh.value;
      const rows=projects.filter(p=>{
        const g=p.g||[];
        if(mode==='github'&&!g.length) return false;
        if(mode==='none'&&g.length) return false;
        if(!term) return true;
        return (p.t+' '+p.s+' '+g.join(' ')).toLowerCase().includes(term);
      });
      meta.textContent=rows.length+' of '+projects.length+' · source Comparee Hub';
      grid.innerHTML=rows.map(p=>{
        const gits=(p.g||[]).slice(0,2).map(u=>'<a href="'+u+'">'+u.replace('https://github.com/','')+'</a>').join(' · ');
        return '<article><h2>'+(p.t||p.s)+'</h2><div class="links"><a href="https://comparee.ai/p/'+p.s+'">Comparee</a>'+(gits?' · '+gits:'')+'</div></article>';
      }).join('');
    }
    Promise.all(['p00','p01','p02','p03','p04','p05','p06'].map(n=>fetch('./'+n+'.json').then(r=>r.ok?r.json():[])))
      .then(parts=>{ projects=parts.flat(); render(); })
      .catch(err=>{ meta.textContent='Catalog load failed: '+err; });
    q.addEventListener('input', render); gh.addEventListener('change', render);
  </script>
</body>
</html>
