<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hornet Bell — the house</title>
  <meta name="description" content="Every family of the nest as a child in the cartoon." />
  <link rel="canonical" href="https://pxd2.github.io/hornet/house.html" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito:wght@500;700&display=swap" />
  <style>
    :root { --cream:#f4ead6; --pine:#1e3a2f; --clay:#c45c26; --ink:#1c1814; }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--cream); color:var(--ink); font:500 16px/1.5 Nunito,system-ui,sans-serif; }
    a { color:var(--clay); }
    header { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; padding:14px 18px; border-bottom:1px solid color-mix(in oklab, var(--pine) 20%, transparent); }
    header a { color:var(--pine); text-decoration:none; letter-spacing:.16em; text-transform:uppercase; font-size:12px; font-weight:700; }
    h1 { font-family:Fraunces,Georgia,serif; color:var(--pine); }
    main { max-width:980px; margin:0 auto; padding:28px 18px 80px; }
    .k { letter-spacing:.16em; text-transform:uppercase; color:var(--clay); font-size:11px; font-weight:700; }
    .grid { display:grid; gap:12px; }
    @media(min-width:700px){ .grid{grid-template-columns:1fr 1fr 1fr} }
    figure { margin:0; background:#fff6; border:1px solid color-mix(in oklab, var(--pine) 16%, transparent); border-radius:12px; overflow:hidden; }
    figure img { width:100%; aspect-ratio:1; object-fit:cover; background:#1e3a2f; }
    figcaption { padding:10px 12px; }
  </style>
</head>
<body>
  <header>
    <a href="/hornet/">Hornet Bell</a>
    <strong style="font-family:Fraunces,serif;color:var(--pine);letter-spacing:0;text-transform:none;font-size:20px">The house</strong>
    <a href="/hornet/lens.html">Lens</a>
  </header>
  <main>
    <p class="k">Ages 6–11 · one household · cousins not statues</p>
    <h1>Characters for every family</h1>
    <p>Locked portraits stay Vee, Lee, and Bell. Each other house now has a child in the pew. Place-pictures stand until Studio A cuts their stills.</p>
    <p id="rule"></p>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    fetch("house.json").then(r => r.json()).then(h => {
      document.getElementById("rule").textContent = h.rule;
      document.getElementById("grid").innerHTML = h.cast.map(c => `
        <figure>
          <img src="${(c.art||"").replace("/hornet/","")}" alt="${c.name}" />
          <figcaption>
            <span class="k">${c.house}</span><br/>
            <strong>${c.name}</strong>
            <div style="font-size:12px;opacity:.8">${c.named_for ? "Named for " + c.named_for : ""}</div>
            <p style="margin:8px 0 0;font-size:14px">${c.role}</p>
          </figcaption>
        </figure>`).join("");
    });
  </script>
  <script src="/sites.js" defer></script>
</body>
</html>
